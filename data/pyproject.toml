[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-x-science"
version = "1.0.0"
description = "TERRAIN-X Planetary Analog Matching & Evaluation Engine for Lunar/Martian Mission Profiles"
authors = [{ name = "TERRAIN-X Science Team", email = "science@terrain-x.space" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "rasterio>=1.4.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "tifffile>=2024.1.1",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
terrain-x = "modules.science.cli:main"

